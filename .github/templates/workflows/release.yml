name: Release

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Build/deploy all workspaces before publish"
        required: false
        default: true
        type: boolean
      ref:
        description: "Git ref or SHA to release"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      deploy:
        description: "Build/deploy all workspaces before publish"
        required: false
        type: boolean
        default: true
      ref:
        description: "Git ref or SHA to release"
        required: false
        type: string
        default: ""
    secrets:
      ZEPHYR_AUTH_TOKEN:
        required: true
      ZEPHYR_SERVER_AUTH_TOKEN:
        required: false
      ZEPHYR_USER_EMAIL:
        required: true
      NEAR_PRIVATE_KEY:
        required: true

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, Deploy & Publish
    runs-on: ubuntu-latest
    env:
      BOS_INSTALL_NEAR_CLI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.20"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run postinstall
        run: bun run postinstall

      - name: Build and deploy
        if: inputs.deploy != false
        env:
          ZE_SECRET_TOKEN: ${{ secrets.ZEPHYR_AUTH_TOKEN }}
          ZE_SERVER_TOKEN: ${{ secrets.ZEPHYR_SERVER_AUTH_TOKEN }}
          ZE_USER_EMAIL: ${{ secrets.ZEPHYR_USER_EMAIL }}
        run: bun run deploy

      - name: Publish config to FastKV
        env:
          NEAR_PRIVATE_KEY: ${{ secrets.NEAR_PRIVATE_KEY }}
        run: bos publish

      - name: Commit bos.config.json updates
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "chore: update deployment URLs [skip ci]"
          file_pattern: "**/bos.config.json"

      - name: Deployment summary
        run: |
          {
            echo "## Release Complete"
            echo ""
            echo "**Zephyr:** UI, API, plugins deployed"
            echo "**FastKV:** bos.config.json published"
          } >> "$GITHUB_STEP_SUMMARY"
