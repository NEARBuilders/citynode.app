name: Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Show full build output instead of clean summary'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy-staging:
    name: Deploy Staging
    uses: NEARBuilders/everything-dev/.github/workflows/consumer-staging.yml@main
    with:
      verbose: ${{ inputs.verbose == true }}
    secrets: inherit
