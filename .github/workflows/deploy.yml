name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Show full build output instead of clean summary'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # packages: write  # re-enable when returning to GHCR image push (ADR 0021)

# env:
#   IMAGE: ghcr.io/nearbuilders/everything-dev

jobs:
  deploy:
    name: Deploy Production
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEAR_PRIVATE_KEY: ${{ secrets.NEAR_PRIVATE_KEY }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (Node 24)
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build everything-dev
        run: bun run --cwd packages/everything-dev build
        # fast build path: ensure dist/ is current so workspace imports
        # in plugins' rspack hooks resolve through the same code as src/.

      - name: Build every-plugin
        run: bun run --cwd packages/every-plugin build

      - name: Build better-near-auth
        run: bun run --cwd packages/better-near-auth build

      # - name: Publish with deploy
      #   timeout-minutes: 20
      #   # NOTE: publish runs locally for now; re-enable this step once
      #   # BOS_STORAGE_API_KEY is set in repo secrets (ADR 0020 CDN deploy).
      #   # env:
      #   #   BOS_BUNDLE_CDN_ORIGIN: https://cdn.everything.dev
      #   #   BOS_STORAGE_API_KEY: ${{ secrets.BOS_STORAGE_API_KEY }}
      #   run: bun run bos publish --deploy --packages local${{ inputs.verbose == true && ' --verbose' || '' }}

      # - name: Log in to GHCR
      #   run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # - name: Build and push the universal runtime image
      #   timeout-minutes: 45
      #   # ADR 0021: the image IS the deployment artifact — the `runtime`
      #   # stage (default target) stages the boot namespace and boots
      #   # `bos start`. Pushed by SHA tag so deploys pin the validated bytes.
      #   run: |
      #     IMAGE_TAG=sha-$(echo "${{ github.event.workflow_run.head_sha || github.sha }}" | cut -c1-7)
      #     echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
      #     docker build --target runtime -t "${IMAGE}:${IMAGE_TAG}" -t "${IMAGE}:latest" .
      #     docker push "${IMAGE}:${IMAGE_TAG}" | tee /tmp/push.log
      #     docker push "${IMAGE}:latest"
      #     # Pin the deploy to the pushed digest, not the mutable tag.
      #     DIGEST=$(grep -o 'sha256:[a-f0-9]*' /tmp/push.log | tail -1)
      #     echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"

      - name: Install Railway CLI
        run: npm i -g @railway/cli@5.47.1

      - name: Build and deploy Railway image
        timeout-minutes: 45
        # railway up builds the committed Dockerfile (multi-stage: all
        # workspace dists stage into the image) and deploys — the image IS
        # the deployment artifact. railway redeploy would re-run the previous
        # build and never ship the new artifacts.
        run: railway up --service app --ci --verbose

      - name: Verify release-train identity (mf check)
        timeout-minutes: 5
        run: |
          # Gate the release train: all host/plugin bundles must agree on shared-dep
          # versions (exact for effect-critical deps) and pluginVersion. Runs AFTER
          # the deploy — image-native deploys serve /bundles/* from the new image,
          # so the check can only pass once it's live.
          attempts=10
          until bun run bos mf check; do
            attempts=$((attempts - 1))
            if [ "$attempts" -le 0 ]; then
              echo "::error::Release-train identity check failed — bundles are inconsistent (deployment did not come up healthy or skew). See bos mf check output."
              exit 1
            fi
            echo "mf check failed; retrying in 20s ($attempts attempt(s) left)…"
            sleep 20
          done

      - name: Deploy smoke — remote runtime against the live deployment
        timeout-minutes: 10
        # ADR 0009 §4: published-config coverage lives in the Deploy workflow.
        # Boots the real host program against the live production URLs from the
        # deployed SHA's bos.config.json — SSR compose from the deployed ui,
        # doc-asset proxy, api ping, root document contract. mf check has
        # already gated the site being up and consistent above.
        run: bun run --cwd host test:integration:remote
