name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Show full build output instead of clean summary'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Production
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEAR_PRIVATE_KEY: ${{ secrets.NEAR_PRIVATE_KEY }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (Node 24)
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build everything-dev
        run: bun run --cwd packages/everything-dev build
        # fast build path: ensure dist/ is current so workspace imports
        # in plugins' rspack hooks resolve through the same code as src/.

      - name: Build every-plugin
        run: bun run --cwd packages/every-plugin build

      - name: Build better-near-auth
        run: bun run --cwd packages/better-near-auth build

      - name: Publish with deploy
        timeout-minutes: 20
        run: bun run bos publish --deploy --packages local${{ inputs.verbose == true && ' --verbose' || '' }}

      - name: Install Railway CLI
        run: npm i -g @railway/cli@5.47.1

      - name: Build and deploy Railway image
        timeout-minutes: 45
        # railway up builds the committed Dockerfile (multi-stage: all
        # workspace dists stage into the image) and deploys — the image IS
        # the deployment artifact (plan 043). railway redeploy would re-run
        # the previous build and never ship the new artifacts.
        run: railway up --service app --ci --verbose
