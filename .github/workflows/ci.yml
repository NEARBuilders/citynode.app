name: CI

# Thin wrapper — the shared implementation lives in the base runtime repo
# (NEARBuilders/everything-dev). This repo owns triggers, secret policy, and
# working directory. The @main ref matches the sync trust model: bos sync
# already tracks the parent's main for all framework-owned files.
on:
  push:
    branches: [main]
    # paths-ignore stays on push only: it gates Deploy (workflow_run). On
    # pull_request a paths-ignored run never reports the required check,
    # which permanently blocks docs-only PRs once branch protection is on.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".changeset/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Change detection — skip CI on docs/changeset-only PRs so they don't burn
  # a full install + lint + typecheck + test run.
  filter:
    name: Filter changes
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci:
              - '**.ts'
              - '**.tsx'
              - '**.js'
              - '**.mjs'
              - '**.cjs'
              - '**.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'biome.json'
              - 'bos.app.ts'
              - 'bos.dev.ts'
              - 'api/**'
              - 'ui/**'
              - 'plugins/**'
              - 'tests/**'

  ci:
    name: CI
    needs: [filter]
    # Always run on push to main; on PRs only run when relevant files changed.
    if: ${{ github.event_name != 'pull_request' || needs.filter.outputs.ci == 'true' }}
    uses: NEARBuilders/everything-dev/.github/workflows/consumer-ci.yml@v2.0.0-rc.17
    with:
      working_directory: .
    secrets: inherit

  # Drift alarm (ADR 0034): the child's recorded `platform` pin (or the
  # inherited default) compared against the latest published release
  # manifest. Exits 1 — i.e. fails this job — when updates are available.
  platform-drift:
    name: Platform Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec bos upgrade --check

  # Self-owned: the citynode browser regression suite (the app's E2E safety
  # net). The reusable consumer-ci job only runs lint/typecheck/vitest — it
  # never boots databases or browsers. This job mirrors the base runtime's
  # browser leg: test-database service containers, then the full retained
  # suite against a local `bos dev` stack (base host remote, local workspaces).
  # Once upstream's consumer-regression.yml (everything-dev#368) ships, this
  # job can move onto it. Red for an upstream reason — the parent's remote
  # host injects an auth context without user.role/organization into child
  # plugin RPCs (everything-dev#531) — so kept non-gating until that lands.
  regression-browser:
    name: Regression browser (dev:ssr)
    needs: [filter, ci]
    if: ${{ github.event_name != 'pull_request' || needs.filter.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      API_DATABASE_URL: postgres://everythingdev:everythingdev@127.0.0.1:5434/api_test_db
      AUTH_DATABASE_URL: postgres://everythingdev:everythingdev@127.0.0.1:5435/auth_test_db
      CORS_ORIGIN: http://localhost:4100
      BETTER_AUTH_SECRET: regression-test-secret-do-not-use-in-production
    services:
      postgres-api-test:
        image: ghcr.io/nearbuilders/mirror-postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: everythingdev
          POSTGRES_PASSWORD: everythingdev
          POSTGRES_DB: api_test_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U everythingdev -d api_test_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      postgres-auth-test:
        image: ghcr.io/nearbuilders/mirror-postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: everythingdev
          POSTGRES_PASSWORD: everythingdev
          POSTGRES_DB: auth_test_db
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U everythingdev -d auth_test_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (Node 24)

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Get pnpm store dir
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (Node 24)
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate resolved config and ui bootstrap stubs
        run: pnpm run types:gen

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (Node 24)
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run browser regression suite (dev:ssr)
        run: pnpm run test:regression:browser:dev:ssr

      - name: Upload regression artifacts on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: regression-browser-artifacts-dev-ssr
          path: |
            .bos/logs/**
            tests/regression/browser/test-results/**
            tests/regression/browser/playwright-report/**

  # Merge gate for branch protection. Require this check name ("Lint and Type
  # Check") in Settings → Branches — it is child-owned and slash-free, unlike
  # the reusable call, which GitHub renders as "CI / Lint, typecheck, and test"
  # (the callee half cannot be overridden and breaks silently on upstream
  # renames). A reusable job cannot take caller jobs in `needs`, so this gate
  # lives here, not in the shared workflow. The browser regression suite stays
  # out of `needs` until everything-dev#531 is fixed upstream.
  lint-and-typecheck-gate:
    name: Lint and Type Check
    needs: [filter, ci]
    if: always() # a plain needs-skip reports "skipped", not failure
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.filter.outputs.ci }}" = "true" ]; then
            test "${{ needs.ci.result }}" = "success"
          else
            echo "Skipping CI gate — no relevant changes detected"
            exit 0
          fi
