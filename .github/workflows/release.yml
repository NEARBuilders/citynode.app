name: Release

# Child release flow — changesets version PR. No npm publish: this repo
# ships no packages. Sync owns this file; expect the child template to
# replace it.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or SHA to release"
        required: false
        default: ""
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version PR
    runs-on: ubuntu-latest
    env:
      TARGET_REF: ${{ inputs.ref != '' && inputs.ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (Node 24)
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_REF }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Create release PR when changesets are pending
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          version: pnpm run version
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

