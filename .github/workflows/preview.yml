name: Preview URL

on:
  pull_request:
    types: [closed]
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: preview-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  publish-preview-url:
    name: Publish Railway preview URL
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Publish preview URL comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        with:
          script: |
            const marker = '<!-- railway-preview-url -->';
            const pr = context.payload.workflow_run.pull_requests[0];
            const railwayToken = process.env.RAILWAY_TOKEN?.trim();
            const railwayProjectId = process.env.RAILWAY_PROJECT_ID?.trim();
            const preferredServiceName = process.env.RAILWAY_SERVICE_NAME?.trim()?.toLowerCase();

            const listComments = async () => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });

              return comments.filter((comment) =>
                comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
              );
            };

            const upsertComment = async (body) => {
              const comments = await listComments();
              if (comments[0]) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comments[0].id,
                  body,
                });
                return;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            };

            const railwayRequest = async (query, variables) => {
              const response = await fetch('https://backboard.railway.com/graphql/v2', {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${railwayToken}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({ query, variables }),
              });

              if (!response.ok) {
                throw new Error(`Railway API request failed with ${response.status}`);
              }

              const payload = await response.json();
              if (payload.errors?.length) {
                throw new Error(payload.errors.map((error) => error.message).join('; '));
              }

              return payload.data;
            };

            if (!railwayToken || !railwayProjectId) {
              core.info('Skipping Railway preview lookup because RAILWAY_TOKEN or RAILWAY_PROJECT_ID is not configured.');
              return;
            }

            const projectQuery = `
              query Project($id: String!) {
                project(id: $id) {
                  services {
                    edges {
                      node {
                        id
                        name
                      }
                    }
                  }
                }
              }
            `;

            const environmentsQuery = `
              query Environments($projectId: String!) {
                environments(projectId: $projectId, isEphemeral: true) {
                  edges {
                    node {
                      id
                      name
                      createdAt
                    }
                  }
                }
              }
            `;

            const domainsQuery = `
              query Domains($projectId: String!, $environmentId: String!, $serviceId: String!) {
                domains(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId) {
                  serviceDomains {
                    domain
                    targetPort
                  }
                }
              }
            `;

            const projectData = await railwayRequest(projectQuery, { id: railwayProjectId });
            const services = projectData.project?.services?.edges?.map((edge) => edge.node) ?? [];

            if (services.length === 0) {
              core.warning(`No Railway services found for project ${railwayProjectId}.`);
              return;
            }

            const prPattern = new RegExp(`(^|[-\\s])pr[-\\s]?${pr.number}($|[-\\s])`, 'i');
            const preferredNames = ['host', 'app', 'web', 'frontend'];

            const pickPreviewEntry = (entries) => {
              if (entries.length === 0) {
                return null;
              }

              if (preferredServiceName) {
                const exactMatch = entries.find((entry) => entry.serviceName.toLowerCase() === preferredServiceName);
                if (exactMatch) {
                  return exactMatch;
                }
              }

              if (entries.length === 1) {
                return entries[0];
              }

              for (const name of preferredNames) {
                const preferred = entries.find((entry) => entry.serviceName.toLowerCase() === name);
                if (preferred) {
                  return preferred;
                }
              }

              for (const name of preferredNames) {
                const preferred = entries.find((entry) => entry.serviceName.toLowerCase().includes(name));
                if (preferred) {
                  return preferred;
                }
              }

              return [...entries].sort((left, right) => left.serviceName.localeCompare(right.serviceName))[0];
            };

            let resolvedEnvironment = null;
            let resolvedEntry = null;

            for (let attempt = 1; attempt <= 20; attempt += 1) {
              const environmentsData = await railwayRequest(environmentsQuery, { projectId: railwayProjectId });
              const environments = environmentsData.environments?.edges?.map((edge) => edge.node) ?? [];
              const matchingEnvironments = environments
                .filter((environment) => prPattern.test(environment.name))
                .sort((left, right) => Date.parse(right.createdAt) - Date.parse(left.createdAt));

              if (matchingEnvironments[0]) {
                resolvedEnvironment = matchingEnvironments[0];
                const domainEntries = [];

                for (const service of services) {
                  const domainsData = await railwayRequest(domainsQuery, {
                    projectId: railwayProjectId,
                    environmentId: resolvedEnvironment.id,
                    serviceId: service.id,
                  });

                  const serviceDomains = domainsData.domains?.serviceDomains ?? [];
                  for (const serviceDomain of serviceDomains) {
                    domainEntries.push({
                      domain: serviceDomain.domain,
                      serviceName: service.name,
                      targetPort: serviceDomain.targetPort,
                    });
                  }
                }

                resolvedEntry = pickPreviewEntry(domainEntries);
                if (resolvedEntry) {
                  break;
                }
              }

              await new Promise((resolve) => setTimeout(resolve, 15000));
            }

            if (!resolvedEnvironment || !resolvedEntry) {
              await upsertComment([
                marker,
                '### Preview URL',
                '',
                'Railway did not expose a preview URL for this PR yet.',
                '',
                'Checks:',
                '- PR Environments are enabled in Railway',
                '- The base service uses a Railway-provided domain',
                '- The base service is image-backed and tracks `ghcr.io/nearbuilders/everything-dev:latest`',
              ].join('\n'));
              return;
            }

            await upsertComment([
              marker,
              '### Preview URL',
              '',
              `**Service:** \`${resolvedEntry.serviceName}\``,
              `**Environment:** \`${resolvedEnvironment.name}\``,
              `**URL:** https://${resolvedEntry.domain}`,
            ].join('\n'));

  cleanup-preview-comment:
    name: Remove preview URL comment
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Delete preview URL comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const marker = '<!-- railway-preview-url -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            for (const comment of comments) {
              if (comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }
